services:
  mongo-db:
    image: mongo:8
    container_name: chat-db
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: fca-server
    restart: unless-stopped
    ports:
      - "7777:7777"
    env_file:
      - ./server/.env
    depends_on:
      mongo-db:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: fca-client
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_BACKEND_URL: http://server:7777
      BACKEND_HOST: server
      BACKEND_PORT: "7777"

    depends_on:
      - server

volumes:
  mongo_data:
